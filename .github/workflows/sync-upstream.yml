name: Sync upstream

on:
  # 每周一北京时间 12:20 运行；GitHub cron 使用 UTC。
  schedule:
    - cron: "20 4 * * 1"
  # 保留 Actions 页面中的手动同步入口。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream master
    runs-on: ubuntu-latest

    steps:
      - name: Check out mirror
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/PotatoSpudowski/MurmurLRS.git
          git fetch --prune --no-tags upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Mirror master is already up to date."
            exit 0
          fi

          # 合并失败时仅处理工作流冲突；代码冲突或其他错误保留日志并停止。
          if ! git merge --no-ff --no-commit upstream/master; then
            mapfile -d '' -t conflicts < <(git diff --name-only --diff-filter=U -z)
            if (( ${#conflicts[@]} == 0 )); then
              echo "::error::Upstream merge failed without file conflicts."
              exit 1
            fi

            for path in "${conflicts[@]}"; do
              if [[ "$path" != .github/workflows/* ]]; then
                echo "::error::Manual resolution required: $path"
                exit 1
              fi
            done

            # 保留本仓库的工作流策略，包括此前有意排除的上游工作流。
            for path in "${conflicts[@]}"; do
              if git cat-file -e "HEAD:$path" 2>/dev/null; then
                git checkout --ours -- "$path"
                git add -- "$path"
              else
                git rm -- "$path"
              fi
            done
          fi

          # GITHUB_TOKEN 不能更新工作流文件；统一恢复本仓库的工作流目录。
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git commit -m "Sync upstream MurmurLRS master"
          git push origin HEAD:master
